<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ask questions about a CSV in plain English. SmartAnalyst writes validated SQL, runs it, and shows you the query."
    />
    <title>SmartAnalyst</title>
    <script>
      // Applied before first paint so the theme does not flash.
      (() => {
        const stored = localStorage.getItem("smartanalyst:theme");
        const dark =
          stored === "dark" ||
          (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
