[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "frontend_app", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101", # assert is the point of a test suite
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S311"] # numpy's default_rng is not a security context

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
