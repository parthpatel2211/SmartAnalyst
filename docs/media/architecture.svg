<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Architecture: the browser sends a question to FastAPI, which asks a model for SQL, validates it, runs it in DuckDB, then asks the model to write the answer from the results.">
  <rect width="1000" height="470" rx="10" fill="#fcfcfb"/>

  <!-- ================= Browser ================= -->
  <rect x="28" y="60" width="250" height="200" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="44" y="88" font-size="13" font-weight="600" fill="#0b0b0b">Browser</text>
  <text x="44" y="107" font-size="11" fill="#898781">GitHub Pages, static</text>

  <rect x="44" y="122" width="218" height="30" rx="6" fill="#eef4fd" stroke="#cde2fb"/>
  <text x="56" y="141" font-size="11" fill="#1c5cab">React · TypeScript · Recharts</text>

  <rect x="44" y="160" width="218" height="30" rx="6" fill="#eef4fd" stroke="#cde2fb"/>
  <text x="56" y="179" font-size="11" fill="#1c5cab">Renders charts, tables and the SQL</text>

  <rect x="44" y="198" width="218" height="46" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
  <text x="56" y="216" font-size="11" fill="#52514e">API key in sessionStorage,</text>
  <text x="56" y="232" font-size="11" fill="#52514e">sent per request, never stored</text>

  <!-- browser -> api -->
  <line x1="278" y1="158" x2="352" y2="158" stroke="#898781" stroke-width="1.5"/>
  <polygon points="352,158 344,154 344,162" fill="#898781"/>
  <text x="286" y="150" font-size="10" fill="#898781">HTTPS</text>

  <!-- ================= API ================= -->
  <rect x="352" y="60" width="330" height="330" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="368" y="88" font-size="13" font-weight="600" fill="#0b0b0b">FastAPI</text>
  <text x="368" y="107" font-size="11" fill="#898781">Render, Docker, one worker</text>

  <rect x="368" y="122" width="298" height="30" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
  <text x="380" y="141" font-size="11" fill="#52514e">1. question plus schema to the model</text>

  <line x1="517" y1="152" x2="517" y2="166" stroke="#898781" stroke-width="1.5"/>
  <polygon points="517,168 513,160 521,160" fill="#898781"/>

  <!-- the guard -->
  <rect x="368" y="170" width="298" height="58" rx="6" fill="#fdeceb" stroke="#e34948" stroke-width="1.5"/>
  <text x="380" y="192" font-size="12" font-weight="600" fill="#a82a2a">2. SQL guard</text>
  <text x="380" y="211" font-size="10.5" fill="#7d2020">one read-only statement, parsed not matched;</text>
  <text x="380" y="223" font-size="10.5" fill="#7d2020">no DDL, DML, ATTACH, COPY or file readers</text>

  <line x1="517" y1="228" x2="517" y2="242" stroke="#898781" stroke-width="1.5"/>
  <polygon points="517,244 513,236 521,236" fill="#898781"/>

  <rect x="368" y="246" width="298" height="30" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
  <text x="380" y="265" font-size="11" fill="#52514e">3. run the query, bounded and timed</text>

  <line x1="517" y1="276" x2="517" y2="290" stroke="#898781" stroke-width="1.5"/>
  <polygon points="517,292 513,284 521,284" fill="#898781"/>

  <rect x="368" y="294" width="298" height="30" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
  <text x="380" y="313" font-size="11" fill="#52514e">4. results back to the model for the answer</text>

  <rect x="368" y="332" width="298" height="42" rx="6" fill="#eefaf4" stroke="#1baf7a"/>
  <text x="380" y="350" font-size="11" fill="#0d6b4a">Deterministic and needing no key:</text>
  <text x="380" y="365" font-size="11" fill="#0d6b4a">profiling, insights, correlations</text>

  <!-- api -> duckdb -->
  <line x1="682" y1="261" x2="756" y2="261" stroke="#898781" stroke-width="1.5"/>
  <polygon points="756,261 748,257 748,265" fill="#898781"/>

  <!-- ================= DuckDB ================= -->
  <rect x="756" y="212" width="216" height="98" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="772" y="240" font-size="13" font-weight="600" fill="#0b0b0b">DuckDB</text>
  <text x="772" y="259" font-size="11" fill="#898781">in memory, per session</text>
  <text x="772" y="280" font-size="10.5" fill="#52514e">external access disabled,</text>
  <text x="772" y="294" font-size="10.5" fill="#52514e">so no filesystem or network</text>

  <!-- api -> model -->
  <line x1="682" y1="137" x2="756" y2="137" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="756,137 748,133 748,141" fill="#898781"/>

  <rect x="756" y="98" width="216" height="80" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="772" y="126" font-size="13" font-weight="600" fill="#0b0b0b">OpenAI or OpenRouter</text>
  <text x="772" y="145" font-size="11" fill="#898781">chosen from the key prefix</text>
  <text x="772" y="164" font-size="10.5" fill="#52514e">writes SQL, then the answer</text>

  <!-- ================= footnote ================= -->
  <text x="28" y="428" font-size="11.5" fill="#52514e">
    The model writes the query. It never writes code, and nothing it returns is executed as code.
  </text>
  <text x="28" y="448" font-size="11.5" fill="#898781">
    Two calls because the first happens before the query runs, so it has no result to report yet.
  </text>
</svg>
